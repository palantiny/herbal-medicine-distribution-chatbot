services:
  postgres:
    image: postgres:15-alpine
    container_name: palantiny_postgres_s2
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: palantiny_redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 50mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chatbot_app:
    build: .
    container_name: palantiny_chatbot_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DYNAMODB_TABLE_CHAT: ${DYNAMODB_TABLE_CHAT:-palantiny-chat-history}
      DJMEDI_API_BASE_URL: ${DJMEDI_API_BASE_URL:-https://devapi.djmedi.net/djherb/}
      DJMEDI_AUTH_KEY: ${DJMEDI_AUTH_KEY:-HERBfHShheT88iuYgNaDvDwgF9X5kBrJ}
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: uvicorn app.chatbot_main:app --host 0.0.0.0 --port 8000

  chat_worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      APP_ENV: production
      AWS_REGION_NAME: ${AWS_REGION_NAME:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      DYNAMODB_TABLE_CHAT: ${DYNAMODB_TABLE_CHAT:-palantiny-chat-history}
      DJMEDI_API_BASE_URL: ${DJMEDI_API_BASE_URL:-https://devapi.djmedi.net/djherb/}
      DJMEDI_AUTH_KEY: ${DJMEDI_AUTH_KEY:-HERBfHShheT88iuYgNaDvDwgF9X5kBrJ}
    restart: unless-stopped
    command: python -m app.workers.chat_main
    deploy:
      replicas: 3

  sql_worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    restart: unless-stopped
    command: python -m app.workers.sql_main
    deploy:
      replicas: 1

volumes:
  postgres_data:
  redis_data:
