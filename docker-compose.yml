# Palantiny Docker Compose - 로컬 개발용
# chatbot_app (8000): 챗봇 서버
# Neo4j AuraDB 사용 (로컬 neo4j 컨테이너 미사용)

services:
  postgres:
    image: postgres:15-alpine
    container_name: palantiny_postgres
    environment:
      POSTGRES_USER: palantiny
      POSTGRES_PASSWORD: palantiny_secret
      POSTGRES_DB: palantiny_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palantiny -d palantiny_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: palantiny_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 50mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  chatbot_app:
    build: .
    container_name: palantiny_chatbot_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://palantiny:palantiny_secret@postgres:5432/palantiny_db
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    command: uvicorn app.chatbot_main:app --host 0.0.0.0 --port 8000 --reload

  chat_worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://palantiny:palantiny_secret@postgres:5432/palantiny_db
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: python -m app.workers.chat_main
    deploy:
      replicas: 3

  sql_worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://palantiny:palantiny_secret@postgres:5432/palantiny_db
      REDIS_URL: redis://redis:6379/0
    command: python -m app.workers.sql_main
    deploy:
      replicas: 1

volumes:
  postgres_data:
  redis_data:
