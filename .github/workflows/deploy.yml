name: Deploy server2

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy Backend (CodeDeploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Create deployment bundle
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x "**/__pycache__/*" \
            -x "*.pyc" \
            -x "*.DS_Store" \
            -x "chatbot_ui.html" \
            -x "docs/*" \
            -x "*.code-workspace"

      - name: Upload bundle to S3
        run: |
          aws s3 cp deploy.zip \
            s3://${{ secrets.CODEDEPLOY_S3_BUCKET }}/server2/deploy.zip

      - name: Create CodeDeploy deployment
        run: |
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name ${{ secrets.CODEDEPLOY_APP_NAME }} \
            --deployment-group-name ${{ secrets.CODEDEPLOY_DEPLOYMENT_GROUP }} \
            --s3-location bucket=${{ secrets.CODEDEPLOY_S3_BUCKET }},key=server2/deploy.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --query 'deploymentId' \
            --output text)

          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV

      - name: Wait for deployment
        run: |
          aws deploy wait deployment-successful \
            --deployment-id $DEPLOYMENT_ID
